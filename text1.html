<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录注册测试</title>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Inter',sans-serif;background:#f0f4fa;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px}
        .container{max-width:500px;width:100%;background:#fff;border-radius:20px;padding:40px 30px;box-shadow:0 8px 32px rgba(0,0,0,0.08)}
        h2{font-size:24px;font-weight:700;margin-bottom:20px;text-align:center}
        .tabs{display:flex;gap:4px;background:#f0f4fa;border-radius:50px;padding:4px;margin-bottom:24px}
        .tabs button{flex:1;padding:10px 0;border-radius:50px;border:none;background:transparent;font-weight:600;font-size:15px;cursor:pointer;transition:.2s;color:#3d5068}
        .tabs button.active{background:#0077ff;color:#fff;box-shadow:0 2px 12px rgba(0,119,255,0.2)}
        .form-group{margin-bottom:16px}
        .form-group label{display:block;font-size:13px;font-weight:500;color:#3d5068;margin-bottom:4px}
        .form-group input{width:100%;padding:10px 14px;border-radius:8px;border:1.5px solid #e2e8f0;font-size:15px;transition:.2s;background:#f8fafc}
        .form-group input:focus{outline:none;border-color:#0077ff;background:#fff;box-shadow:0 0 0 3px rgba(0,119,255,0.1)}
        .btn-submit{width:100%;padding:12px;border-radius:50px;background:linear-gradient(135deg,#0077ff,#6c5ce7);color:#fff;border:none;font-weight:700;font-size:16px;cursor:pointer;transition:.2s}
        .btn-submit:hover{transform:scale(1.02);box-shadow:0 4px 20px rgba(0,119,255,0.3)}
        .forgot-pwd-link{display:block;text-align:right;font-size:13px;color:#0077ff;cursor:pointer;margin-top:4px;text-decoration:underline}
        .back-to-login{display:block;text-align:center;font-size:13px;color:#0077ff;cursor:pointer;margin-top:12px}
        .form-error{color:#e74c3c;font-size:14px;text-align:center;margin-top:6px;min-height:22px}
        .form-success{color:#27ae60;font-size:14px;text-align:center;margin-top:6px;min-height:22px}
        .hidden{display:none!important}
        .user-id-display{background:#f0f4fa;border-radius:8px;padding:16px;text-align:center;margin:12px 0;border:2px dashed #0077ff}
        .user-id-display .id{font-size:28px;font-weight:800;color:#0077ff;font-family:monospace}
        .user-id-display .hint{font-size:13px;color:#7a8ca3;margin-top:4px}
        .vip-status{text-align:center;padding:12px;border-radius:8px;margin:12px 0}
        .vip-status.active{background:rgba(39,174,96,0.08);border:1px solid rgba(39,174,96,0.2);color:#27ae60}
        .vip-status.inactive{background:rgba(231,76,60,0.06);border:1px solid rgba(231,76,60,0.12);color:#e74c3c}
        .flex-btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:12px}
        .flex-btns .btn-submit{flex:1;min-width:100px}
        .btn-outline{background:transparent;border:1px solid #e2e8f0;color:#3d5068}
        .btn-outline:hover{background:#f0f4fa;transform:none;box-shadow:none}
        .change-pwd-form .form-group input{background:#fff}
        .change-pwd-form h3{font-size:18px;font-weight:700;margin-bottom:12px}
    </style>
</head>
<body>
<div class="container" id="app">
    <h2 id="modalTitle">✦ 登录</h2>

    <!-- 主登录/注册区域 -->
    <div id="authMain">
        <div class="tabs">
            <button class="active" data-tab="login">登录</button>
            <button data-tab="register">注册</button>
        </div>
        <div id="loginForm">
            <div class="form-group"><label>用户名</label><input type="text" id="loginUsername" placeholder="请输入用户名"></div>
            <div class="form-group"><label>密码</label><input type="password" id="loginPassword" placeholder="请输入密码"></div>
            <button class="btn-submit" id="loginBtn">登 录</button>
            <div class="forgot-pwd-link" id="forgotPwdLink">忘记密码？</div>
            <div class="form-error" id="loginError"></div>
        </div>
        <div id="registerForm" class="hidden">
            <div class="form-group"><label>用户名</label><input type="text" id="regUsername" placeholder="4-16位字母/数字/中文"></div>
            <div class="form-group"><label>邮箱 (可选)</label><input type="email" id="regEmail" placeholder="用于找回密码"></div>
            <div class="form-group"><label>密码</label><input type="password" id="regPassword" placeholder="至少6位"></div>
            <div class="form-group"><label>确认密码</label><input type="password" id="regConfirm" placeholder="再次输入密码"></div>
            <button class="btn-submit" id="registerBtn">注 册</button>
            <div class="form-error" id="regError"></div>
            <div class="form-success" id="regSuccess"></div>
        </div>
    </div>

    <!-- 忘记密码 -->
    <div id="forgotPwdForm" class="hidden">
        <div class="form-group"><label>用户名或邮箱</label><input type="text" id="forgotInput" placeholder="请输入用户名或邮箱"></div>
        <button class="btn-submit" id="forgotBtn">发送重置请求</button>
        <div class="back-to-login" id="backToLogin">← 返回登录</div>
        <div class="form-error" id="forgotError"></div>
        <div class="form-success" id="forgotSuccess"></div>
    </div>

    <!-- 用户信息（登录后） -->
    <div id="userInfo" class="hidden">
        <div class="user-id-display">
            <div style="font-size:13px;color:#7a8ca3;">您的用户ID</div>
            <div class="id" id="userCode">U10001</div>
            <div class="hint">请将此ID提供给客服开通VIP权限</div>
        </div>
        <div class="vip-status" id="vipStatusDisplay"><i class="fas fa-user"></i> 当前状态：普通用户</div>
        <div class="flex-btns">
            <button class="btn-submit btn-outline" id="changePwdBtn">修改密码</button>
            <button class="btn-submit" id="myVipBtn" style="background:linear-gradient(135deg,#f59e0b,#d97706);">我的VIP</button>
            <button class="btn-submit btn-outline" id="logoutBtn">退出登录</button>
        </div>
    </div>

    <!-- 修改密码 -->
    <div id="changePwdForm" class="hidden">
        <h3>修改密码</h3>
        <div class="form-group"><label>当前密码</label><input type="password" id="oldPwdInput" placeholder="输入当前密码"></div>
        <div class="form-group"><label>新密码</label><input type="password" id="newPwdInput" placeholder="至少6位"></div>
        <div class="form-group"><label>确认新密码</label><input type="password" id="confirmPwdInput" placeholder="再次输入新密码"></div>
        <button class="btn-submit" id="changePwdSubmit">确认修改</button>
        <div class="back-to-login" id="backToUserInfo">← 返回</div>
        <div class="form-error" id="changePwdError"></div>
        <div class="form-success" id="changePwdSuccess"></div>
    </div>
</div>

<script>
    // Supabase 配置
    var SUPABASE_URL = 'https://qqcxtfayjxyvswblmdpw.supabase.co';
    var SUPABASE_ANON_KEY = 'sb_publishable__KOJGRcvoRGC3QiHNg7_qA_-9yGsnCW';
    var supabaseClient = (typeof supabase !== 'undefined') ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;
    if (!supabaseClient) console.error('Supabase 未加载');

    // 工具函数
    function hashPwd(p) {
        var h = 0;
        for (var i = 0; i < p.length; i++) {
            var c = p.charCodeAt(i);
            h = ((h << 5) - h) + c;
            h = h & h;
        }
        return h.toString(16);
    }

    function generateUserCode() {
        var num = Math.floor(10000 + Math.random() * 90000);
        return 'U' + num;
    }

    function toast(msg, type) {
        type = type || 'success';
        alert(msg); // 简单提示，方便调试
        console.log('Toast:', type, msg);
    }

    // 页面元素
    var loginForm = document.getElementById('loginForm');
    var registerForm = document.getElementById('registerForm');
    var forgotForm = document.getElementById('forgotPwdForm');
    var userInfoDiv = document.getElementById('userInfo');
    var changePwdForm = document.getElementById('changePwdForm');
    var authMain = document.getElementById('authMain');

    var loginUsername = document.getElementById('loginUsername');
    var loginPassword = document.getElementById('loginPassword');
    var loginBtn = document.getElementById('loginBtn');
    var loginError = document.getElementById('loginError');

    var regUsername = document.getElementById('regUsername');
    var regEmail = document.getElementById('regEmail');
    var regPassword = document.getElementById('regPassword');
    var regConfirm = document.getElementById('regConfirm');
    var registerBtn = document.getElementById('registerBtn');
    var regError = document.getElementById('regError');
    var regSuccess = document.getElementById('regSuccess');

    var forgotInput = document.getElementById('forgotInput');
    var forgotBtn = document.getElementById('forgotBtn');
    var forgotError = document.getElementById('forgotError');
    var forgotSuccess = document.getElementById('forgotSuccess');
    var backToLogin = document.getElementById('backToLogin');

    var userCode = document.getElementById('userCode');
    var vipStatusDisplay = document.getElementById('vipStatusDisplay');
    var changePwdBtn = document.getElementById('changePwdBtn');
    var myVipBtn = document.getElementById('myVipBtn');
    var logoutBtn = document.getElementById('logoutBtn');

    var oldPwdInput = document.getElementById('oldPwdInput');
    var newPwdInput = document.getElementById('newPwdInput');
    var confirmPwdInput = document.getElementById('confirmPwdInput');
    var changePwdSubmit = document.getElementById('changePwdSubmit');
    var changePwdError = document.getElementById('changePwdError');
    var changePwdSuccess = document.getElementById('changePwdSuccess');
    var backToUserInfo = document.getElementById('backToUserInfo');

    var forgotPwdLink = document.getElementById('forgotPwdLink');

    var currentUser = null;

    // 切换显示
    function showLoginForm() {
        authMain.style.display = 'block';
        loginForm.style.display = 'block';
        registerForm.style.display = 'none';
        forgotForm.style.display = 'none';
        userInfoDiv.style.display = 'none';
        changePwdForm.style.display = 'none';
        document.getElementById('modalTitle').textContent = '✦ 登录';
        loginError.textContent = '';
    }

    function showRegisterForm() {
        authMain.style.display = 'block';
        loginForm.style.display = 'none';
        registerForm.style.display = 'block';
        forgotForm.style.display = 'none';
        userInfoDiv.style.display = 'none';
        changePwdForm.style.display = 'none';
        document.getElementById('modalTitle').textContent = '✦ 注册';
        regError.textContent = '';
        regSuccess.textContent = '';
    }

    function showForgotPwd() {
        authMain.style.display = 'none';
        forgotForm.style.display = 'block';
        userInfoDiv.style.display = 'none';
        changePwdForm.style.display = 'none';
        document.getElementById('modalTitle').textContent = '✦ 找回密码';
        forgotError.textContent = '';
        forgotSuccess.textContent = '';
    }

    function showUserInfo(user) {
        authMain.style.display = 'none';
        loginForm.style.display = 'none';
        registerForm.style.display = 'none';
        forgotForm.style.display = 'none';
        changePwdForm.style.display = 'none';
        userInfoDiv.style.display = 'block';
        document.getElementById('modalTitle').textContent = '👤 我的信息';
        userCode.textContent = user.user_code;
        // 更新VIP状态
        if (user.vip_status) {
            var expireDate = user.vip_expire ? new Date(user.vip_expire) : null;
            var now = new Date();
            var daysLeft = expireDate ? Math.ceil((expireDate - now) / (1000 * 60 * 60 * 24)) : 0;
            if (daysLeft > 0) {
                vipStatusDisplay.className = 'vip-status active';
                vipStatusDisplay.innerHTML = '<i class="fas fa-crown"></i> ✅ VIP会员 · 剩余 ' + daysLeft + ' 天';
            } else if (expireDate && daysLeft <= 0) {
                vipStatusDisplay.className = 'vip-status inactive';
                vipStatusDisplay.innerHTML = '<i class="fas fa-crown"></i> ⚠️ VIP已过期，请联系客服续费';
            } else {
                vipStatusDisplay.className = 'vip-status active';
                vipStatusDisplay.innerHTML = '<i class="fas fa-crown"></i> ✅ VIP会员（永久）';
            }
        } else {
            vipStatusDisplay.className = 'vip-status inactive';
            vipStatusDisplay.innerHTML = '<i class="fas fa-user"></i> 当前状态：普通用户';
        }
    }

    function showChangePwd() {
        authMain.style.display = 'none';
        loginForm.style.display = 'none';
        registerForm.style.display = 'none';
        forgotForm.style.display = 'none';
        userInfoDiv.style.display = 'none';
        changePwdForm.style.display = 'block';
        document.getElementById('modalTitle').textContent = '✦ 修改密码';
        changePwdError.textContent = '';
        changePwdSuccess.textContent = '';
    }

    // 注册
    async function registerUser() {
        var username = regUsername.value.trim();
        var email = regEmail.value.trim();
        var password = regPassword.value;
        var confirm = regConfirm.value;
        regError.textContent = '';
        regSuccess.textContent = '';

        if (username.length < 4 || username.length > 16) { regError.textContent = '用户名需4-16位'; return; }
        if (!/^[a-zA-Z0-9_\u4e00-\u9fa5]+$/.test(username)) { regError.textContent = '用户名仅支持字母、数字、下划线、中文'; return; }
        if (password.length < 6) { regError.textContent = '密码至少6位'; return; }
        if (password !== confirm) { regError.textContent = '两次密码不一致'; return; }

        if (!supabaseClient) { regError.textContent = 'Supabase 未加载，请检查网络'; return; }

        // 检查用户名是否存在
        var { data: existUser, error: existErr } = await supabaseClient.from('users').select('id').eq('username', username).maybeSingle();
        if (existUser) { regError.textContent = '用户名已被注册'; return; }
        if (email) {
            var { data: existEmail, error: emailErr } = await supabaseClient.from('users').select('id').eq('email', email).maybeSingle();
            if (existEmail) { regError.textContent = '邮箱已被使用'; return; }
        }

        var userCode = generateUserCode();
        var { data, error } = await supabaseClient.from('users').insert({
            username: username,
            email: email || null,
            password: hashPwd(password),
            user_code: userCode,
            vip_status: false,
            vip_expire: null
        }).select().single();

        if (error) { regError.textContent = '注册失败：' + error.message; return; }

        regSuccess.textContent = '注册成功！请登录';
        toast('注册成功，请登录', 'success');
        setTimeout(function() {
            regSuccess.textContent = '';
            // 切换到登录
            document.querySelector('[data-tab="login"]').click();
            loginUsername.value = username;
            loginPassword.value = '';
        }, 1500);
    }

    // 登录
    async function loginUser() {
        var username = loginUsername.value.trim();
        var password = loginPassword.value;
        loginError.textContent = '';

        if (!username || !password) { loginError.textContent = '请填写用户名和密码'; return; }
        if (!supabaseClient) { loginError.textContent = 'Supabase 未加载'; return; }

        var { data, error } = await supabaseClient.from('users').select('*').eq('username', username).maybeSingle();
        if (error || !data) { loginError.textContent = '用户名或密码错误'; return; }
        if (data.password !== hashPwd(password)) { loginError.textContent = '用户名或密码错误'; return; }

        currentUser = data;
        sessionStorage.setItem('lezhe_vip_user', JSON.stringify(data));
        showUserInfo(data);
        toast('欢迎回来，' + data.username, 'success');
        // 如果有重定向标记
        if (sessionStorage.getItem('redirect_after_login')) {
            sessionStorage.removeItem('redirect_after_login');
            window.location.href = '/vip.html';
        }
    }

    // 忘记密码
    async function forgotPassword() {
        var input = forgotInput.value.trim();
        forgotError.textContent = '';
        forgotSuccess.textContent = '';
        if (!input) { forgotError.textContent = '请输入用户名或邮箱'; return; }
        if (!supabaseClient) { forgotError.textContent = 'Supabase 未加载'; return; }

        var { data, error } = await supabaseClient.from('users')
            .select('username, email')
            .or('username.eq.' + input + ',email.eq.' + input)
            .maybeSingle();
        if (error || !data) {
            forgotError.textContent = '未找到该用户，请确认输入正确';
            return;
        }
        forgotSuccess.innerHTML = '重置链接已发送至您的邮箱（如果已绑定）。<br>若未收到，请联系客服 <strong>QQ: 150772520</strong> 协助重置。';
        if (data.email) {
            try {
                var { error: resetError } = await supabaseClient.auth.resetPasswordForEmail(data.email, {
                    redirectTo: window.location.origin + '/reset-password.html'
                });
                if (resetError) console.warn('重置邮件发送失败:', resetError);
            } catch (e) {}
        }
    }

    // 修改密码
    async function changePassword() {
        var oldPwd = oldPwdInput.value;
        var newPwd = newPwdInput.value;
        var confirmPwd = confirmPwdInput.value;
        changePwdError.textContent = '';
        changePwdSuccess.textContent = '';

        if (!oldPwd || !newPwd || !confirmPwd) { changePwdError.textContent = '请填写完整'; return; }
        if (newPwd.length < 6) { changePwdError.textContent = '新密码至少6位'; return; }
        if (newPwd !== confirmPwd) { changePwdError.textContent = '两次密码不一致'; return; }
        if (!currentUser) { changePwdError.textContent = '请先登录'; return; }
        if (hashPwd(oldPwd) !== currentUser.password) { changePwdError.textContent = '当前密码错误'; return; }
        if (!supabaseClient) { changePwdError.textContent = 'Supabase 未加载'; return; }

        var { error } = await supabaseClient.from('users')
            .update({ password: hashPwd(newPwd) })
            .eq('id', currentUser.id);
        if (error) { changePwdError.textContent = '修改失败：' + error.message; return; }

        changePwdSuccess.textContent = '密码修改成功！请重新登录。';
        currentUser.password = hashPwd(newPwd);
        sessionStorage.setItem('lezhe_vip_user', JSON.stringify(currentUser));
        toast('密码已更新', 'success');
        setTimeout(function() {
            logoutUser();
        }, 1500);
    }

    function logoutUser() {
        sessionStorage.removeItem('lezhe_vip_user');
        currentUser = null;
        userInfoDiv.style.display = 'none';
        authMain.style.display = 'block';
        changePwdForm.style.display = 'none';
        forgotForm.style.display = 'none';
        showLoginForm();
        toast('已退出登录', 'success');
    }

    // 页面加载完成后绑定事件
    document.addEventListener('DOMContentLoaded', function() {
        // Tab 切换
        document.querySelectorAll('.tabs button').forEach(function(btn) {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.tabs button').forEach(function(b) { b.classList.remove('active'); });
                this.classList.add('active');
                if (this.dataset.tab === 'login') showLoginForm();
                else showRegisterForm();
            });
        });

        // 登录按钮
        loginBtn.addEventListener('click', loginUser);
        // 注册按钮
        registerBtn.addEventListener('click', registerUser);
        // 忘记密码链接
        forgotPwdLink.addEventListener('click', function(e) { e.preventDefault(); showForgotPwd(); });
        // 返回登录
        backToLogin.addEventListener('click', function() { showLoginForm(); });
        // 发送重置
        forgotBtn.addEventListener('click', forgotPassword);
        // 修改密码按钮
        changePwdBtn.addEventListener('click', function() { showChangePwd(); });
        // 返回用户信息
        backToUserInfo.addEventListener('click', function() { if (currentUser) showUserInfo(currentUser); else showLoginForm(); });
        // 确认修改密码
        changePwdSubmit.addEventListener('click', changePassword);
        // 我的VIP
        myVipBtn.addEventListener('click', function() { window.location.href = '/vip.html'; });
        // 退出登录
        logoutBtn.addEventListener('click', logoutUser);

        // 回车提交
        loginPassword.addEventListener('keydown', function(e) { if (e.key === 'Enter') loginUser(); });
        regConfirm.addEventListener('keydown', function(e) { if (e.key === 'Enter') registerUser(); });

        // 恢复登录状态
        var saved = sessionStorage.getItem('lezhe_vip_user');
        if (saved) {
            try {
                var user = JSON.parse(saved);
                currentUser = user;
                showUserInfo(user);
            } catch (e) {}
        } else {
            showLoginForm();
        }
    });
</script>
</body>
</html>
