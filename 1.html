<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes" />
    <title>乐哲软件 · 管理后台</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700&display=swap" rel="stylesheet" />
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-primary: #080c14;
            --bg-secondary: #0f172a;
            --bg-card: rgba(18, 30, 51, 0.78);
            --bg-card-solid: #121e33;
            --bg-input: rgba(0, 0, 0, 0.25);
            --border-glow: rgba(0, 200, 255, 0.15);
            --border-glow-strong: rgba(0, 200, 255, 0.35);
            --text-primary: #eef5ff;
            --text-secondary: #8da4c9;
            --text-dim: #4a6185;
            --accent-cyan: #00d4ff;
            --accent-blue: #3b82f6;
            --accent-purple: #8b5cf6;
            --accent-green: #34d399;
            --shadow-card: 0 8px 32px rgba(0, 0, 0, 0.6);
            --radius-lg: 20px;
            --radius-md: 12px;
            --radius-sm: 8px;
            --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            --font: 'Inter', -apple-system, sans-serif;
            --max-width: 1200px;
            --header-height: 64px;
            --sidebar-width: 210px;
        }
        [data-theme="light"] {
            --bg-primary: #f0f4ff;
            --bg-secondary: #e8edf8;
            --bg-card: rgba(255, 255, 255, 0.82);
            --bg-card-solid: #ffffff;
            --bg-input: rgba(0, 0, 0, 0.05);
            --border-glow: rgba(0, 100, 200, 0.15);
            --border-glow-strong: rgba(0, 100, 200, 0.30);
            --text-primary: #0a1628;
            --text-secondary: #3d557a;
            --text-dim: #7a8aa8;
            --shadow-card: 0 8px 32px rgba(0, 0, 0, 0.08);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: var(--font);
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
            transition: background 0.3s, color 0.3s;
            background-image: radial-gradient(ellipse at 20% 50%, rgba(59, 130, 246, 0.05) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 20%, rgba(139, 92, 246, 0.04) 0%, transparent 50%);
        }
        [data-theme="light"] body {
            background-image: radial-gradient(ellipse at 20% 50%, rgba(59, 130, 246, 0.03) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 20%, rgba(139, 92, 246, 0.02) 0%, transparent 50%);
        }
        a { text-decoration: none; color: inherit; }
        button { cursor: pointer; font-family: inherit; border: none; background: none; color: inherit; }
        input, textarea, select { font-family: inherit; border: none; outline: none; background: none; color: var(--text-primary); }
        .container { max-width: var(--max-width); margin: 0 auto; padding: 0 24px; }
        .hidden { display: none !important; }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 28px;
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: 600;
            transition: var(--transition);
            border: 1px solid transparent;
            background: var(--bg-card);
            color: var(--text-primary);
            backdrop-filter: blur(8px);
            border-color: var(--border-glow);
            min-height: 44px;
        }
        .btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.15);
            border-color: var(--accent-cyan);
        }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none !important; }
        .btn-primary {
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
            color: #080c14;
            border-color: transparent;
            font-weight: 700;
        }
        .btn-primary:hover:not(:disabled) {
            box-shadow: 0 0 40px rgba(0, 212, 255, 0.3);
            transform: translateY(-2px) scale(1.02);
        }
        .btn-outline {
            background: transparent;
            border-color: var(--border-glow);
            color: var(--text-secondary);
        }
        .btn-outline:hover:not(:disabled) {
            background: rgba(0, 212, 255, 0.06);
            border-color: var(--accent-cyan);
            color: var(--text-primary);
        }
        .btn-danger {
            background: rgba(239, 68, 68, 0.15);
            border-color: rgba(239, 68, 68, 0.2);
            color: #f87171;
        }
        .btn-danger:hover:not(:disabled) {
            background: rgba(239, 68, 68, 0.25);
            border-color: #ef4444;
            color: #fff;
        }
        .btn-success {
            background: rgba(52, 211, 153, 0.15);
            border-color: rgba(52, 211, 153, 0.2);
            color: var(--accent-green);
        }
        .btn-success:hover:not(:disabled) {
            background: rgba(52, 211, 153, 0.25);
            border-color: var(--accent-green);
            color: #fff;
        }
        .btn-sm { padding: 6px 18px; font-size: 0.8rem; min-height: 36px; }
        .btn-xs { padding: 3px 12px; font-size: 0.7rem; border-radius: 50px; min-height: 30px; }
        .btn-back {
            background: transparent;
            border-color: transparent;
            color: var(--text-secondary);
            padding: 4px 8px;
            gap: 4px;
            min-height: 32px;
            font-size: 0.85rem;
        }
        .btn-back:hover:not(:disabled) {
            border-color: var(--border-glow);
            color: var(--text-primary);
            transform: translateX(-2px);
            box-shadow: none;
        }
        .card {
            background: var(--bg-card);
            backdrop-filter: blur(16px);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-glow);
            box-shadow: var(--shadow-card);
            transition: var(--transition);
            overflow: hidden;
        }
        .badge {
            display: inline-block;
            padding: 2px 14px;
            border-radius: 50px;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            background: rgba(0, 212, 255, 0.1);
            color: var(--accent-cyan);
            border: 1px solid rgba(0, 212, 255, 0.15);
        }
        .badge-purple {
            background: rgba(139, 92, 246, 0.12);
            color: var(--accent-purple);
            border-color: rgba(139, 92, 246, 0.2);
        }
        .badge-green {
            background: rgba(52, 211, 153, 0.12);
            color: var(--accent-green);
            border-color: rgba(52, 211, 153, 0.2);
        }
        .badge-dim {
            background: rgba(255, 255, 255, 0.04);
            color: var(--text-dim);
            border-color: rgba(255, 255, 255, 0.06);
        }
        .badge-danger {
            background: rgba(239, 68, 68, 0.12);
            color: #f87171;
            border-color: rgba(239, 68, 68, 0.15);
        }
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }
        .empty-state .icon { font-size: 48px; margin-bottom: 16px; opacity: 0.5; }
        .empty-state h3 { font-size: 1.2rem; margin-bottom: 8px; color: var(--text-primary); }
        .login-page {
            display: none;
            min-height: 100vh;
            align-items: center;
            justify-content: center;
            background: var(--bg-primary);
            padding: 20px;
            position: relative;
        }
        .login-page.active { display: flex; }
        .login-page .bg-glow {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            pointer-events: none;
            opacity: 0.12;
        }
        .login-page .bg-glow:nth-child(1) { width: 400px; height: 400px; top: -100px; right: -100px; background: var(--accent-cyan); }
        .login-page .bg-glow:nth-child(2) { width: 300px; height: 300px; bottom: -80px; left: -80px; background: var(--accent-purple); }
        .login-box {
            width: 100%;
            max-width: 380px;
            padding: 36px 32px;
            background: var(--bg-card-solid);
            backdrop-filter: blur(32px);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-glow-strong);
            box-shadow: var(--shadow-card), 0 0 60px rgba(0, 212, 255, 0.02);
            position: relative;
            z-index: 2;
        }
        .login-box .login-logo {
            font-size: 2rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 2px;
            background: linear-gradient(135deg, #fff 30%, var(--accent-cyan) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        [data-theme="light"] .login-box .login-logo {
            background: linear-gradient(135deg, #0a1628 30%, var(--accent-blue) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .login-box .login-sub {
            text-align: center;
            color: var(--text-secondary);
            font-weight: 300;
            margin-bottom: 24px;
            font-size: 0.85rem;
            letter-spacing: 2px;
        }
        .login-box .form-group { margin-bottom: 14px; }
        .login-box label {
            display: block;
            font-size: 0.78rem;
            font-weight: 500;
            margin-bottom: 4px;
            color: var(--text-secondary);
            letter-spacing: 0.5px;
        }
        .login-box input {
            width: 100%;
            padding: 11px 14px;
            border-radius: var(--radius-sm);
            border: 1.5px solid var(--border-glow);
            background: var(--bg-input);
            transition: var(--transition);
            font-size: 0.9rem;
            color: var(--text-primary);
            min-height: 48px;
        }
        .login-box input:focus {
            border-color: var(--accent-cyan);
            background: rgba(0, 0, 0, 0.4);
        }
        .login-box .btn {
            width: 100%;
            margin-top: 6px;
            padding: 13px;
            font-size: 0.95rem;
            min-height: 52px;
        }
        .login-box .login-error {
            color: #f87171;
            font-size: 0.8rem;
            text-align: center;
            margin-top: 10px;
            min-height: 22px;
        }
        .admin-layout {
            display: none;
            min-height: 100vh;
            background: var(--bg-primary);
        }
        .admin-layout.active { display: flex; }
        .admin-sidebar {
            width: var(--sidebar-width);
            background: rgba(12, 20, 35, 0.88);
            backdrop-filter: blur(24px);
            border-right: 1px solid var(--border-glow);
            padding: 24px 14px;
            flex-shrink: 0;
            height: 100vh;
            position: sticky;
            top: 0;
            overflow-y: auto;
            transition: background 0.3s, border-color 0.3s;
        }
        [data-theme="light"] .admin-sidebar {
            background: rgba(240, 244, 255, 0.92);
            border-right-color: rgba(0, 100, 200, 0.12);
        }
        .admin-sidebar .logo-sm {
            font-size: 1.1rem;
            font-weight: 700;
            padding: 0 8px 20px;
            border-bottom: 1px solid var(--border-glow);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-primary);
        }
        .admin-sidebar .logo-sm .mark {
            font-size: 1.2rem;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .admin-sidebar .nav-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            font-weight: 500;
            color: var(--text-secondary);
            transition: var(--transition);
            margin-bottom: 2px;
            cursor: pointer;
            border: 1px solid transparent;
            font-size: 0.9rem;
            min-height: 44px;
        }
        .admin-sidebar .nav-item:hover {
            background: rgba(0, 212, 255, 0.04);
            border-color: var(--border-glow);
            color: var(--text-primary);
        }
        .admin-sidebar .nav-item.active {
            background: rgba(0, 212, 255, 0.06);
            border-color: var(--border-glow-strong);
            color: var(--text-primary);
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.03);
        }
        .admin-sidebar .nav-item .icon {
            font-size: 1rem;
            width: 24px;
            text-align: center;
            color: var(--accent-cyan);
        }
        .admin-sidebar .logout-btn {
            margin-top: 28px;
            border-top: 1px solid var(--border-glow);
            padding-top: 16px;
            color: var(--text-dim);
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: var(--transition);
            min-height: 44px;
        }
        .admin-sidebar .logout-btn:hover { color: #f87171; }
        .admin-sidebar .theme-toggle {
            margin-top: 12px;
            padding: 8px 14px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-glow);
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.8rem;
            color: var(--text-secondary);
            cursor: pointer;
            transition: var(--transition);
            background: transparent;
            min-height: 44px;
        }
        .admin-sidebar .theme-toggle:hover {
            border-color: var(--accent-cyan);
            color: var(--text-primary);
        }
        .admin-main {
            flex: 1;
            padding: 28px 36px 60px;
            overflow-y: auto;
            max-height: 100vh;
        }
        .admin-main .page-title {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 2px;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .admin-main .page-title .back-link {
            font-size: 0.85rem;
            font-weight: 400;
            color: var(--text-secondary);
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 2px 10px;
            border-radius: 50px;
            border: 1px solid transparent;
        }
        .admin-main .page-title .back-link:hover {
            border-color: var(--border-glow);
            color: var(--text-primary);
            transform: translateX(-2px);
        }
        .admin-main .page-sub {
            color: var(--text-secondary);
            margin-bottom: 24px;
            font-weight: 400;
            font-size: 0.9rem;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 14px;
            margin-bottom: 28px;
        }
        .stat-card {
            padding: 18px 20px;
            background: var(--bg-card);
            backdrop-filter: blur(8px);
            border-radius: var(--radius-md);
            border: 1px solid var(--border-glow);
            box-shadow: var(--shadow-card);
        }
        .stat-card .num {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .stat-card .label {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-top: 2px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .table-wrap {
            background: var(--bg-card);
            backdrop-filter: blur(8px);
            border-radius: var(--radius-md);
            border: 1px solid var(--border-glow);
            box-shadow: var(--shadow-card);
            overflow: hidden;
            margin-top: 6px;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            position: relative;
            min-height: auto;
        }
        .table-wrap .loading-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
            font-size: 0.9rem;
            color: var(--text-secondary);
            gap: 10px;
        }
        .table-wrap .loading-overlay .spinner {
            width: 24px;
            height: 24px;
            border: 2px solid var(--border-glow);
            border-top-color: var(--accent-cyan);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .table-wrap table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.82rem;
            min-width: 500px;
        }
        .table-wrap th {
            text-align: left;
            padding: 10px 12px;
            background: rgba(0, 212, 255, 0.03);
            font-weight: 600;
            color: var(--text-secondary);
            font-size: 0.65rem;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            border-bottom: 1px solid var(--border-glow);
            position: sticky;
            top: 0;
            background: var(--bg-card);
            z-index: 1;
            backdrop-filter: blur(8px);
            white-space: nowrap;
            cursor: pointer;
            user-select: none;
        }
        .table-wrap th:hover { color: var(--text-primary); }
        .table-wrap th .sort-icon { font-size: 0.6rem; margin-left: 4px; opacity: 0.4; }
        .table-wrap th.active .sort-icon { opacity: 1; }
        .table-wrap td {
            padding: 8px 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.02);
            color: var(--text-primary);
            vertical-align: middle;
        }
        [data-theme="light"] .table-wrap td { border-bottom-color: rgba(0, 0, 0, 0.04); }
        .table-wrap tr.clickable { cursor: pointer; transition: var(--transition); }
        .table-wrap tr.clickable:hover { background: rgba(0, 212, 255, 0.03); }
        .table-wrap td .icon-thumb {
            width: 32px;
            height: 32px;
            border-radius: var(--radius-sm);
            overflow: hidden;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 212, 255, 0.06);
            font-size: 18px;
            border: 1px solid rgba(0, 212, 255, 0.06);
        }
        .table-wrap td .icon-thumb img { width: 100%; height: 100%; object-fit: cover; }
        .table-wrap td .actions {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
        }
        .table-wrap td .actions button {
            padding: 3px 10px;
            border-radius: 50px;
            font-size: 0.6rem;
            font-weight: 600;
            transition: var(--transition);
            border: 1px solid transparent;
            min-height: 28px;
        }
        .table-wrap td .actions .edit-btn {
            background: rgba(0, 212, 255, 0.08);
            color: var(--accent-cyan);
            border-color: rgba(0, 212, 255, 0.1);
        }
        .table-wrap td .actions .edit-btn:hover {
            background: var(--accent-cyan);
            color: #080c14;
        }
        .table-wrap td .actions .del-btn {
            background: rgba(239, 68, 68, 0.08);
            color: #f87171;
            border-color: rgba(239, 68, 68, 0.1);
        }
        .table-wrap td .actions .del-btn:hover {
            background: #ef4444;
            color: #fff;
        }
        .table-wrap td .actions .view-btn {
            background: rgba(139, 92, 246, 0.08);
            color: var(--accent-purple);
            border-color: rgba(139, 92, 246, 0.1);
        }
        .table-wrap td .actions .view-btn:hover {
            background: var(--accent-purple);
            color: #fff;
        }
        .table-wrap .empty-row td {
            padding: 36px 18px;
            text-align: center;
            color: var(--text-dim);
        }
        .table-wrap .checkbox-cell {
            width: 36px;
            text-align: center;
        }
        .table-wrap .checkbox-cell input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: var(--accent-cyan);
            cursor: pointer;
            flex-shrink: 0;
        }
        .admin-form {
            background: var(--bg-card);
            backdrop-filter: blur(8px);
            border-radius: var(--radius-md);
            border: 1px solid var(--border-glow);
            box-shadow: var(--shadow-card);
            padding: 24px 28px;
            margin-top: 6px;
        }
        .admin-form .form-group { margin-bottom: 16px; }
        .admin-form label {
            display: block;
            font-size: 0.82rem;
            font-weight: 500;
            margin-bottom: 4px;
            color: var(--text-secondary);
        }
        .admin-form label .required { color: #f87171; margin-left: 2px; }
        .admin-form input,
        .admin-form textarea,
        .admin-form select {
            width: 100%;
            padding: 9px 14px;
            border-radius: var(--radius-sm);
            border: 1.5px solid var(--border-glow);
            background: var(--bg-input);
            transition: var(--transition);
            font-size: 0.88rem;
            color: var(--text-primary);
            min-height: 44px;
        }
        .admin-form input:focus,
        .admin-form textarea:focus,
        .admin-form select:focus {
            border-color: var(--accent-cyan);
            background: rgba(0, 0, 0, 0.4);
        }
        .admin-form textarea { min-height: 70px; resize: vertical; }
        .admin-form .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }
        .admin-form .form-actions {
            display: flex;
            gap: 12px;
            margin-top: 6px;
            flex-wrap: wrap;
        }
        .admin-form select option { background: #121e33; }
        [data-theme="light"] .admin-form select option { background: #ffffff; color: #0a1628; }
        .admin-form .icon-preview {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-top: 6px;
            font-size: 0.8rem;
            color: var(--text-secondary);
            flex-wrap: wrap;
        }
        .admin-form .icon-preview .preview-box {
            width: 40px;
            height: 40px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-glow);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.2);
            font-size: 22px;
            flex-shrink: 0;
        }
        .admin-form .icon-preview .preview-box img { width: 100%; height: 100%; object-fit: cover; }
        .admin-form .checkbox-group {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            padding-top: 6px;
        }
        .admin-form .checkbox-group label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 400;

        if (input.length !== len) return false;
        var computedHash = hashPassword(input).split('x')[0];
        return computedHash === expectedHash;
